<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Collaborative Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
  <script src="/socket.io/socket.io.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-mono">
  <div id="landing-page" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-gray-800 rounded-xl shadow-2xl p-8 border border-gray-700">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-purple-600 to-blue-600 mb-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">Live Collaborative Workspace</h1>
        <p class="text-gray-400">Real-time code collaboration with persistent rooms</p>
      </div>

      <div id="create-room-form" class="space-y-4">
        <h2 class="text-lg font-semibold text-white border-b border-gray-700 pb-2">Create New Room</h2>
        <div>
          <label class="block text-sm text-gray-300 mb-1">Room ID (optional)</label>
          <input type="text" id="create-room-id" placeholder="Auto-generated if empty" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent text-white">
        </div>
        <div>
          <label class="block text-sm text-gray-300 mb-1">Passcode (optional)</label>
          <input type="password" id="create-passcode" placeholder="Leave empty for no passcode" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent text-white">
        </div>
        <div>
          <label class="block text-sm text-gray-300 mb-1">Your Name</label>
          <input type="text" id="create-user-name" placeholder="Enter your name" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent text-white">
        </div>
        <button id="btn-create-room" class="w-full py-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold rounded-lg hover:from-purple-700 hover:to-blue-700 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 focus:ring-offset-gray-800">
          Create Room
        </button>
      </div>

      <div class="my-6 relative">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-700"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-4 bg-gray-800 text-gray-500">OR</span>
        </div>
      </div>

      <div id="join-room-form" class="space-y-4">
        <h2 class="text-lg font-semibold text-white border-b border-gray-700 pb-2">Join Existing Room</h2>
        <div>
          <label class="block text-sm text-gray-300 mb-1">Room ID</label>
          <input type="text" id="join-room-id" placeholder="Enter room ID" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent text-white uppercase">
        </div>
        <div id="join-passcode-field">
          <label class="block text-sm text-gray-300 mb-1">Passcode</label>
          <input type="password" id="join-passcode" placeholder="Enter passcode" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent text-white">
        </div>
        <div>
          <label class="block text-sm text-gray-300 mb-1">Your Name</label>
          <input type="text" id="join-user-name" placeholder="Enter your name" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent text-white">
        </div>
        <button id="btn-join-room" class="w-full py-3 bg-gray-700 text-white font-semibold rounded-lg hover:bg-gray-600 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 focus:ring-offset-gray-800">
          Join Room
        </button>
      </div>

      <div id="error-message" class="mt-4 p-3 bg-red-900/30 border border-red-700 rounded-lg text-red-300 text-sm hidden"></div>
    </div>
  </div>

  <div id="workspace-page" class="hidden min-h-screen flex flex-col">
    <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <button id="btn-leave-room" class="p-2 rounded-lg hover:bg-gray-700 transition-colors text-gray-400 hover:text-white" title="Leave Room">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
        </button>
        <div>
          <h1 id="room-title" class="text-xl font-bold text-white"></h1>
          <p id="room-subtitle" class="text-xs text-gray-500"></p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span id="connection-status" class="flex items-center gap-1 text-sm text-gray-400">
          <span class="w-2 h-2 rounded-full bg-red-500" id="status-indicator"></span>
          <span id="status-text">Disconnected</span>
        </span>
        <div class="flex items-center gap-2 px-3 py-1 bg-gray-700 rounded-lg">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
          </svg>
          <span id="user-count" class="text-sm font-medium text-white">0</span>
          <span class="text-xs text-gray-500">users</span>
        </div>
      </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
      <div class="flex-1 flex flex-col min-w-0">
        <div class="flex items-center justify-between px-4 py-2 bg-gray-800 border-b border-gray-700">
          <div class="flex items-center gap-2">
            <label class="text-xs text-gray-400">Language:</label>
            <select id="language-select" class="px-2 py-1 bg-gray-700 border border-gray-600 rounded text-white text-sm focus:outline-none focus:ring-1 focus:ring-purple-500">
              <option value="javascript">JavaScript</option>
              <option value="python">Python</option>
              <option value="htmlmixed">HTML</option>
              <option value="css">CSS</option>
              <option value="text/plain">Plain Text</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <button id="btn-copy-room-id" class="px-3 py-1 text-xs bg-gray-700 hover:bg-gray-600 rounded transition-colors" title="Copy Room ID">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
              </svg>
            </button>
            <span id="display-room-id" class="text-xs font-mono text-gray-400 px-2 py-1 bg-gray-700 rounded"></span>
          </div>
        </div>
        <div id="editor-container" class="flex-1 relative min-h-0">
          <textarea id="code-editor"></textarea>
        </div>
      </div>

      <aside class="w-72 lg:w-80 bg-gray-800 border-l border-gray-700 flex flex-col min-w-0 hidden lg:flex">
        <div class="p-3 border-b border-gray-700">
          <h2 class="text-sm font-semibold text-white flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            Participants
          </h2>
        </div>
        <div id="participants-list" class="flex-1 overflow-y-auto p-3 space-y-2 min-h-0">
        </div>
        <div class="border-t border-gray-700">
          <div class="p-3 border-b border-gray-700">
            <h2 class="text-sm font-semibold text-white flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
              </svg>
              Activity Feed
            </h2>
          </div>
          <div id="audit-feed" class="flex-1 overflow-y-auto p-3 space-y-2 min-h-0 max-h-64">
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div id="mobile-sidebar" class="lg:hidden fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50" id="sidebar-backdrop"></div>
    <div class="absolute right-0 top-0 h-full w-72 bg-gray-800 border-l border-gray-700 flex flex-col">
      <div class="p-3 border-b border-gray-700 flex items-center justify-between">
        <h2 class="text-sm font-semibold text-white">Participants & Activity</h2>
        <button id="btn-close-sidebar" class="p-1 rounded hover:bg-gray-700 text-gray-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-3 space-y-2">
        <div class="border-b border-gray-700 pb-3">
          <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Participants</h3>
          <div id="mobile-participants-list" class="space-y-2"></div>
        </div>
        <div>
          <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Activity Feed</h3>
          <div id="mobile-audit-feed" class="space-y-2 max-h-64 overflow-y-auto"></div>
        </div>
      </div>
    </div>
  </div>

  <button id="btn-open-sidebar" class="lg:hidden fixed bottom-4 right-4 p-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-full shadow-lg z-40" aria-label="Open sidebar">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
    </svg>
  </button>

  <script src="app.js"></script>
</body>
</html>
